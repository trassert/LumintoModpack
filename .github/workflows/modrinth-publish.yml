name: Publish to Modrinth

on:
  push:
    branches: [ 1.21.10 ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Create modpack.zip
        run: |
          zip -r modpack.zip \
            mods/ config/ resourcepacks/ shaderpacks/ \
            options.txt servers.dat

      - name: Publish to Modrinth
        uses: kir-antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-project: lumintomods
          files: modpack.zip
          name: "Luminto Pack 1.7.9"
          version: "1.7.9"
          version-type: release
          loaders: fabric
          game-versions: 1.21.1
          changelog: "Автообновление сборки"