name: Publish to Modrinth

on:
  push:
    branches: [ 1.21.10 ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create modpack
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          zip -r LumintoPack.mrpack mods/ config/ resourcepacks/ shaderpacks/ options.txt servers.dat

      - name: Publish to Modrinth
        uses: kir-antipov/mc-publish@v3.3
        with:
          modrinth-id: lumintomods
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          
          files: LumintoPack.mrpack
          
          name: "Luminto Pack 1.7.9"
          version: "1.7.9"
          version-type: release
          changelog: "Автообновление сборки"
          
          loaders: fabric
          game-versions: 1.21.10