name: Publish to Modrinth

on:
  push:
    branches: [ 1.21.10 ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Modrinth CLI
        run: npm install -g @modrinth/cli

      - name: Publish modpack
        run: modrinth version create --token ${{ secrets.MODRINTH_TOKEN }}